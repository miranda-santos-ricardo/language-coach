[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "language-coach-backend"
version = "0.1.0"
description = "Backend for the AI Language & Professional Communication Coach"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
